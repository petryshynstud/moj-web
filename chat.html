<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — SkillMatch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* 1. Фіксуємо сторінку без скролу, але зберігаємо ширину під скролбар як на інших сторінках */
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }

    /* 2. Контейнер чату займає всю доступну висоту екрану */
    .chat-section {
      padding: 12px 20px 16px;
      max-width: 1200px;
      margin: 0 auto;
      height: calc(100dvh / 1.15 - 62px);
      box-sizing: border-box;
    }

    .chat-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* --- Лівий стовпець --- */
    .chat-sidebar {
      padding: 0;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .chat-sidebar-top {
      padding: 20px 20px 16px;
      border-bottom: 1px solid #f1f5f9;
      flex-shrink: 0;
    }

    .chat-eyebrow-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .chat-eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2563eb; }
    .chat-badge-count { background: #2563eb; color: #ffffff; font-size: 0.75rem; font-weight: 700; width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; }
    .chat-sidebar-top h1 { margin: 0 0 14px; font-size: 1.65rem; line-height: 1.2; letter-spacing: -0.02em; }

    .chat-search-wrap { position: relative; }
    .chat-search-wrap input { width: 100%; box-sizing: border-box; padding: 10px 14px 10px 36px; border: 1px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 0.9rem; background: #f8fafc; outline: none; }
    .chat-search-wrap input:focus { border-color: #2563eb; background: #ffffff; }
    .chat-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; display: inline-flex; pointer-events: none; }

    .chat-list { flex: 1; overflow-y: auto; min-height: 0; }

    .chat-item { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid #f1f5f9; border-left: 3px solid transparent; cursor: pointer; transition: background 0.15s ease; }
    .chat-item:hover { background: #f8fafc; }
    .chat-item.active { background: #eff6ff; border-left-color: #2563eb; }

    /* Масштабуємо фото як у .avatar-circle-wrap, щоб прибрати чорну рамку */
    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      background: #e2e8f0;
      border: 2px solid #e2e8f0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.3);
    }

    .chat-item-info { flex: 1; min-width: 0; }
    .chat-item-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
    .chat-item-header h3 { margin: 0; font-size: 0.98rem; }
    .chat-time { font-size: 0.75rem; color: #94a3b8; }
    .chat-preview { margin: 0; font-size: 0.85rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* --- Правий стовпець (Чат) --- */
    .chat-main {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chat-header-left { display: flex; align-items: center; gap: 14px; }
    .chat-header-actions { display: flex; align-items: center; gap: 8px; }
    .chat-header-title h2 { margin: 0 0 2px; font-size: 1.05rem; }
    .chat-status { margin: 0; font-size: 0.85rem; color: #64748b; display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; }
    .chat-btn-outline { padding: 9px 16px; border-radius: 10px; border: 1px solid #e2e8f0; background: #ffffff; color: #334155; font-family: inherit; font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer; }
    .chat-btn-outline:hover { border-color: #cbd5e1; background: #f8fafc; }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #fafafa;
    }

    .chat-date-divider { align-self: center; background: #f1f5f9; color: #64748b; font-size: 0.78rem; font-weight: 600; padding: 4px 14px; border-radius: 999px; margin-bottom: 4px; }

    .message-row { display: flex; flex-direction: column; max-width: 72%; }
    .message-row.incoming { align-self: flex-start; }
    .message-row.outgoing { align-self: flex-end; }
    .message-bubble { padding: 12px 16px; border-radius: 16px; font-size: 0.92rem; line-height: 1.55; word-wrap: break-word; white-space: pre-wrap; }
    .message-row.incoming .message-bubble { background: #ffffff; border: 1px solid #e2e8f0; color: #0f172a; border-bottom-left-radius: 4px; }
    .message-row.outgoing .message-bubble { background: #2563eb; color: #ffffff; border-bottom-right-radius: 4px; }

    .message-time { font-size: 0.72rem; color: #94a3b8; margin-top: 4px; padding: 0 4px; }
    .message-row.outgoing .message-time { text-align: right; }

    .chat-footer {
      padding: 14px 24px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      flex-shrink: 0;
    }

    .chat-form { display: flex; align-items: center; gap: 12px; }
    .chat-form input { flex: 1; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 0.92rem; background: #f8fafc; outline: none; }
    .chat-form input:focus { border-color: #2563eb; background: #ffffff; }
    .chat-form .btn-primary { background: #2563eb; color: #ffffff; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .chat-form .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navigation container" aria-label="Hlavná navigácia">
      <a class="brand" href="dashboard.html" aria-label="SkillMatch, dashboard"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span><span>Skill<span>Match</span></span></a>
      <div class="nav-links">
        <a class="nav-link" href="dashboard.html">Home</a>
        <a class="nav-link" href="matching-hub.html">Matching Hub</a>
        <a class="nav-link is-active" href="chat.html">Chat</a>
      </div>
      <div class="nav-actions">
        <a href="moj-profil.html" class="btn btn-primary">Môj profil</a>
        <a href="index.html" class="login-link">Odhlásiť sa</a>
      </div>
      <button class="menu-button icon-button" type="button" aria-label="Otvoriť menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </nav>
  </header>

  <main class="chat-section">
    <div class="chat-layout">
      <aside class="chat-sidebar">
        <div class="chat-sidebar-top">
          <div class="chat-eyebrow-row">
            <span class="chat-eyebrow">Komunikácia</span>
            <span class="chat-badge-count">3</span>
          </div>
          <h1>Správy</h1>
          <div class="chat-search-wrap">
            <span class="chat-search-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" id="chat-search-input" placeholder="Hľadať konverzáciu..." aria-label="Hľadať konverzáciu">
          </div>
        </div>
        <div class="chat-list" id="chat-list"></div>
      </aside>

      <section class="chat-main">
        <div class="chat-header">
          <div class="chat-header-left">
            <button type="button" id="mobile-chat-back" class="mobile-chat-back-btn">← Späť</button>
            <div class="chat-avatar">
              <img id="active-chat-avatar" src="img/jakub.png" alt="">
            </div>
            <div class="chat-header-title">
              <h2 id="active-chat-name">Načítava sa...</h2>
              <p class="chat-status">
                <span class="status-dot"></span>
                <span id="active-chat-role">Online</span>
              </p>
            </div>
          </div>
          <div class="chat-header-actions">
            <a href="profil-jakub.html" class="chat-btn-outline" id="active-profile-link">Zobraziť profil</a>
          </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-footer">
          <form class="chat-form" id="chat-form">
            <input type="text" id="chat-input" placeholder="Napíš správu..." autocomplete="off" required>
            <button type="submit" class="btn-primary" id="send-btn">Odoslať →</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="chat.js"></script>
</body>
</html>
